<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TheCocktailDB</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <section>
    <div class="container text-center">
      <div id="alertBox" class="alert alert-warning alert-dismissible fade show d-none" role="alert">
        <strong>Warning!</strong> You can’t add more than 7 drinks to the group!
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>


      <div class="mt-5">
        <div class="input-group mb-3 w-50 mx-auto">
          <input type="text" class="form-control p-2" id="searchInput" placeholder="Search for a meal..."
            aria-label="Search for a meal" aria-describedby="button-addon2" />
          <button class="btn btn-success" type="button" id="searchBtn" onclick="handleSearch()">
            Search
          </button>
        </div>
      </div>


      <!-- Card and Cart Section -->
      <div class="row">
        <div class="col-lg-9 col-12 mb-4">
          <div class="row row-cols-1 row-cols-sm-2 row-cols-md-2 row-cols-lg-2 row-cols-xl-3 g-2" id="cardShow">
          </div>
        </div>

        <div class="col-lg-3 col-12">
          <div class="p-3 bg-light border rounded">
            <h5 class="text-success fw-bold">🛒 Your Cart</h5>
            <ul id="cartItems" class="list-unstyled">
              <p><strong>Total Drinks:</strong> <span id="drinkCount">0</span></p>
              <div id="drinksList"></div>
            </ul>
          </div>
        </div>
      </div>
  </section>

  <!-- Modal for Meal Details -->
  <div class="modal fade" id="mealDetailModal" tabindex="-1" aria-labelledby="mealDetailModalLabel" aria-hidden="true">
    <div class="modal-dialog custom-modal modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title text-center w-100" id="mealDetailModalLabel">Drinks Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="modalBodyContent"></div>
      </div>
    </div>
  </div>

  <script src="https://kit.fontawesome.com/2b2dafac87.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>

</html>
